name: Swap functional tests

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
    - master
    - main
    - develop

permissions:
  actions: write
  contents: write
  pull-requests: write
  packages: read

jobs:
  job_functional_tests:
    uses: LedgerHQ/app-exchange-dev/.github/workflows/reusable_swap_functional_tests.yml@develop
    with:
      branch_for_cosmos: ${{ github.ref }}
      test_filter: '"ATOM or atom or Cosmos or cosmos"'
    secrets:
      token: ${{ secrets.CI_BOT_TOKEN }}
